<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" fill="none">
  <!-- Sound Waveform at Top -->
  <g id="waveform" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 140 90 L 168 90 L 182 72 L 198 100 L 216 50 L 230 118 L 246 16 L 250 102" stroke="#009A49" />
    <path d="M 250 102 L 258 28 L 272 100 L 286 62 L 302 90 L 314 82 L 328 90 L 360 90" stroke="#FF7900" />
  </g>

  <!-- Controller Body -->
  <g id="controller">
    <path d="M 185 120 
             C 198 116, 218 110, 250 125 
             C 282 110, 302 116, 315 120 
             C 328 125, 342 142, 348 165 
             C 356 198, 368 240, 362 268 
             C 358 286, 340 292, 324 276 
             C 305 258, 292 222, 280 226 
             C 268 230, 260 242, 250 242 
             C 240 242, 232 230, 220 226 
             C 208 222, 195 258, 176 276 
             C 160 292, 142 286, 138 268 
             C 132 240, 144 198, 152 165 
             C 158 142, 172 125, 185 120 Z" 
          fill="#11161B" 
          stroke="#222C36" 
          stroke-width="5" />

    <!-- Center Chevron Stripes -->
    <path d="M 224 140 L 250 172 L 276 140" fill="none" stroke="#009A49" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 232 128 L 250 152 L 268 128" fill="none" stroke="#FF7900" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Left Grip Chevron Patterns -->
    <path d="M 148 228 L 168 212 L 180 230" fill="none" stroke="#009A49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 143 246 L 163 232" fill="none" stroke="#FF7900" stroke-width="6" stroke-linecap="round" />
    <polygon points="168,226 177,242 160,242" fill="#FF7900" />

    <!-- Right Grip Chevron Patterns -->
    <path d="M 352 228 L 332 212 L 320 230" fill="none" stroke="#009A49" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 357 246 L 337 232" fill="none" stroke="#FF7900" stroke-width="6" stroke-linecap="round" />
    <polygon points="332,226 340,242 323,242" fill="#009A49" />

    <!-- Left Controls (Green) -->
    <rect x="180" y="157" width="10" height="28" rx="4" fill="#009A49" />
    <rect x="171" y="166" width="28" height="10" rx="4" fill="#009A49" />
    <circle cx="212" cy="198" r="15" fill="#009A49" />

    <!-- Right Controls (Orange) -->
    <circle cx="248" cy="204" r="15" fill="#FF7900" />
    <rect x="296" y="142" width="13" height="13" rx="2" transform="rotate(45 302 148)" fill="#FF7900" />
    <rect x="277" y="161" width="12" height="12" rx="2" fill="#FF7900" />
    <circle cx="325" cy="167" r="7" fill="#FF7900" />
    <polygon points="302,182 310,195 294,195" fill="#FF7900" />
  </g>
</svg>
